name: Expand V55 source tree

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  expand:
    if: ${{ !contains(github.event.head_commit.message, 'Expand V55 source tree') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand V55 archive
        run: |
          tar -xzf property-vision-v55.tar.gz
          rm property-vision-v55.tar.gz
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Expand V55 source tree"
          git push
