name: Expand V55 source tree

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  expand:
    if: ${{ !contains(github.event.head_commit.message, 'Expand V55 source tree') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild V55 archive
        run: |
          cat .v55-chunks/part01.b64 .v55-chunks/part02.b64 | head -c 10000 | base64 -d > property-vision-v55.tar.gz
          gzip -t property-vision-v55.tar.gz
          tar -tzf property-vision-v55.tar.gz >/dev/null
      - name: Expand V55 archive
        run: |
          tar -xzf property-vision-v55.tar.gz
          rm -f property-vision-v55.tar.gz
          rm -rf .v55-chunks
          rm -f .github/v55-trigger.txt .github/v55-trigger-2.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Expand V55 source tree"
          git push
